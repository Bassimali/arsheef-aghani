
name: Build Arsheef Aghani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q Arsheef-Aghani-Source.zip -d source

      - name: Fix Java and Kotlin target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source/arsheef-aghani")
          files = [
              p for p in root.rglob("build.gradle*")
              if p.is_file()
          ]

          changed = 0
          for p in files:
              original = p.read_text()
              updated = original.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              updated = updated.replace(
                  "VERSION_1_8",
                  "VERSION_17"
              )
              if updated != original:
                  p.write_text(updated)
                  print(f"Updated: {p}")
                  changed += 1

          print(f"Gradle files updated: {changed}")
          PY

      - name: Build debug APK
        working-directory: source/arsheef-aghani
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Arsheef-Aghani-APK
          path: source/arsheef-aghani/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
